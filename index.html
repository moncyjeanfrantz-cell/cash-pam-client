<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASH PAM SERVICE FINANCIER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaf7ff;
      color: #18364b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    h1 {
      color: #087db5;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #526b7b;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .access-button {
      display: block;
      width: 100%;
      padding: 19px;
      margin: 15px 0;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .client {
      background: #1688c7;
    }

    .agent {
      background: #168b62;
    }

    .admin {
      background: #344b65;
    }

    .access-button:hover {
      opacity: 0.88;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #718391;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>CASH PAM</h1>

    <h2>SERVICE FINANCIER</h2>

    <p class="subtitle">
      Bienvenue sur la plateforme officielle de CASH PAM.
      Veuillez sélectionner votre espace d'accès.
    </p>

    <a class="access-button client"
       href="https://script.google.com/macros/s/AKfycby-FImwk-Ms1_VVaJz9hMmeJJG4cKqyw620oK27Sd2I6ShDvgw-8bxw3fGxX3YMNXcr/exec">
      ESPACE CLIENT
    </a>

    <a class="access-button agent"
       href="https://script.google.com/macros/s/AKfycby-FImwk-Ms1_VVaJz9hMmeJJG4cKqyw620oK27Sd2I6ShDvgw-8bxw3fGxX3YMNXcr/exec?page=agent">
      ESPACE AGENT
    </a>

    <a class="access-button admin"
       href="https://script.google.com/macros/s/AKfycby-FImwk-Ms1_VVaJz9hMmeJJG4cKqyw620oK27Sd2I6ShDvgw-8bxw3fGxX3YMNXcr/exec?page=admin">
      ESPACE ADMINISTRATEUR
    </a>

    <footer>
      © CASH PAM SERVICE FINANCIER — Tous droits réservés.
    </footer>

</body>
</html>
